name: Pipeline CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        run: mvn clean verify

      # NOVO: lê o nome da aplicação direto do pom.xml (<artifactId>)
      - name: Obter nome da aplicação
        run: echo "APP_NAME=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)" >> "$GITHUB_ENV"

      - name: Enviar artefato JAR
        uses: actions/upload-artifact@v4
        with:
          # ALTERADO: nome da aplicação + commit
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: target/*.jar
